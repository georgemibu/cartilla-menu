<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="menu">
        <div class="nav-receta">
                <img src="/assets/atras.svg" alt="">
                <img src="/assets/tres-puntos.svg" alt="">
                <img src="/assets/menu.svg" alt="">
        </div>
        <div class="foto-receta">
            <img src="./assets/pollo-asado-horno-patatas-cebolla.jpg" alt="Foto receta">
        </div>
        <div class="descripcion-receta">
            <h1 class="titulo-receta">Pollo al horno con papas fritas</h1>
            <h2 class="precio-receta">$10.00</h2>
        </div>
        <div class="detalle-receta">
            <p class="detalle">Pollo dorado al horno con hierbas aromáticas, acompañado de papas rústicas crujientes, cocidas lentamente para lograr un equilibrio perfecto entre sabor, textura y aroma casero.</p>
        </div>

        <div class="valoracion-receta">
            <div class="valoracion-img-container">
                <img src="./assets/star.svg" alt="valoración">
                <p>4.0</p>
            </div>
            <div class="valoracion-img-container">
                <img src="./assets/fuego.png" alt="kcal">
                <p>600 kcal</p>
            </div>
            <div class="valoracion-img-container">
                <img src="./assets/despertador.png" alt="cocción">
                <p>20 min</p>
            </div>

        </div>

        <div class="ingredientes-receta">
            <h3>Ingredientes</h3>
            <div class="ingredientes">
                <div class="img-container">
                    <img src="./assets/Nueva carpeta/pollo.png" alt="">
                </div>
                <div class="img-container">
                    <img src="./assets/Nueva carpeta/patata.png" alt="">
                </div>
                <div class="img-container">
                    <img src="./assets/Nueva carpeta/cebolla.png" alt="">
                </div>
                <div class="img-container">
                    <img src="./assets/Nueva carpeta/manzana.png" alt="">
                </div>
                

            </div>
        </div>
        <div class="agregar-receta-container">
            <div class="contador-cantidad">
                <button  id="menos">-</button>
                <p>0</p>
                <button id="mas">+</button>
            </div>
            <div class="add-receta-container">
                <button class="add-to-cart">
                    <img src="./assets/carrito-de-compras.svg" alt="Agregar al carrito">
                    <p>AÑADIR AL CARRITO</p>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
